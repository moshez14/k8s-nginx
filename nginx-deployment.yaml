apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: maifocus-ns-prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: 297053566157.dkr.ecr.eu-west-1.amazonaws.com/maifocus-rep:nginx-1.0.3
        imagePullPolicy: Always
        ports:
        - containerPort: 1935
        - containerPort: 8080
        resources:
          requests:
            cpu: "2"
            memory: "5Gi"
          limits:
            cpu: "2"
            memory: "10Gi"
        volumeMounts:
        - name: nginx-storage
          mountPath: /var/www/html/show
        - name: mp4-storage
          mountPath: /var/data
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: nginx-storage
        persistentVolumeClaim:
          claimName: nginx-efs-pvc
      - name: mp4-storage
        persistentVolumeClaim:
          claimName: mp4-efs-pvc
      - name: nginx-conf
        configMap:
          name: nginx-conf

