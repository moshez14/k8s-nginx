#user www-data;
worker_processes 1;
pid /var/www/html/nginx.pid;
#pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
        worker_connections 65535;
        # multi_accept on;
}

http {
# Add at the top-level (http {} or main context)
        client_body_temp_path /var/www/html/nginx_client_body_temp;
        proxy_temp_path       /var/www/html/nginx_proxy_temp;
        fastcgi_temp_path     /var/www/html/nginx_fastcgi_temp;
        uwsgi_temp_path       /var/www/html/uwsgi_temp;
        scgi_temp_path        /var/www/html/scgi_temp;

        ##
        # Basic Settings
        ##

        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server {
                listen 8080;
                server_name nginx.www.maifocus.com;
                location / {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Expose-Headers' 'Content-Length';
                        root /var/www/html;
                        index index.html index.htm index.html inde.php index.m3u8;
                }
                location /live/ {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                add_header 'Access-Control-Expose-Headers' 'Content-Length';
                        root /var/www/html;
                        types {
                        application/vnd.apple.mpegurl m3u8;
                        text/html html;
                        }
                autoindex on;
                autoindex_localtime on;
                autoindex_exact_size off;

                expires -1;
                }
                location /cameras {
                        alias /var/www/html/show;
                        autoindex on;
                        autoindex_exact_size off;
                        autoindex_localtime on;
                }
                location /show/ {
                        mp4;
                        mp4_buffer_size       1m;
                        mp4_max_buffer_size   5m;
                        root /var/www/html;
                        index index.html index.htm index.html inde.php index.m3u8;
                        # CORS Headers
                        add_header 'Access-Control-Allow-Origin' '*';
                        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS';
                        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range';
                        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range';

                }
                location /apidocs {
                proxy_pass http://192.168.49.2:30000/apidocs;
                }
        }
        # server_tokens off;

        # server_names_hash_bucket_size 64;
        # server_name_in_redirect off;

        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        ##
        # SSL Settings
        ##

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
        ssl_prefer_server_ciphers on;

        ##
        # Logging Settings
        ##

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        ##
        # Gzip Settings
        ##

        gzip on;
        #include /etc/nginx/conf.d/*.conf;
        #include /etc/nginx/sites-enabled/*;

}


# RTMP configuration
rtmp {
    server {
        listen 1935; # Listen on standard RTMP port
        chunk_size 4096;
            application live_hls {
            live on; # Allows live input

            # ffmpeg (potential resolutions 426x240, 640x360, 854x480, 1280x720, 1920x1080)
            # We are not degrading audio-quality here only video.
            # To enable more qualities simply uncomment the lines below. Don't forget to adjust the ; as well as uncomment the hls_variant below!
            # exec ffmpeg   -y -vsync 0 -hwaccel cuda  -i rtmp://localhost/live_hls/$name
            exec ffmpeg -i rtmp://localhost/live_hls/$name
              -c:v libx264 -x264opts keyint=60:no-scenecut -b:v 3000k -r 25 -c:a copy -s 426x240 -r 30 -sws_flags bilinear -tune zerolatency  -preset veryfast -f flv rtmp://localhost/show/$name;
            #exec ffmpeg -hide_banner -nostats -loglevel info -i rtmp://localhost:1935/show/$name  -c copy -f segment -segment_time 10 -segment_format mp4 -strftime 1 -reset_timestamps 1 -movflags frag_keyframe+empty_moov /var/data/process_689653639cf893a25d553ea5_6887cea119bbe82c6c7b786b_%Y-%m-%d-%H:%M:%S.mp4; 
	    exec ffmpeg -i rtmp://localhost/live_hls/$name
               -c:v libx264 -x264opts keyint=60:no-scenecut -b:v 3000k -r 25 -c:a copy -s 426x240 -r 30 -sws_flags bilinear -tune zerolatency  -preset veryfast -f flv rtmp://www.maifocus.com/show/$name;
            #exec_push /home/ubuntu/livestream/lwp.sh $name;
            #exec_push lwp-request  http://localhost:8000/$name;
        }
        # This application is for splitting the stream into HLS fragments
        application show {
            live on; # Allows live input from above
            hls on; # Enable HTTP Live Streaming
            hls_type live; # Either 'event' or 'live' (live means played from current live position)
            #deny play all; # Disable consuming the stream from nginx as rtmp

            hls_fragment 2s;
            hls_playlist_length 6s;
            hls_nested on;
            hls_cleanup on;

            # Pointing this to an SSD is better as this involves lots of IO
            hls_path /var/www/html/show;

            # Instruct clients to adjust resolution according to bandwidth
            hls_variant _subsd BANDWIDTH=400000;
            #hls_variant _sd BANDWIDTH=1000000;
            #hls_variant _hd BANDWIDTH=5000000;
        }

        application hls {
            live on;

            hls on;
            hls_path /var/www/html/hls;
            hls_nested on;

            hls_variant _low BANDWIDTH=160000;
            hls_variant _mid BANDWIDTH=320000;
            hls_variant _hi  BANDWIDTH=640000;
        }
	}
}

